[package]
name = "northstar-yfd-packer"
version = "0.1.2"
edition = "2021"
build = "build.rs"
description = "North Star .yfd NEF8 font dictionary packer"
license = "MIT"

[dependencies]
northstar-cli = { path = "../../shared/northstar_cli" }
northstar-nef8 = { path = "../../shared/northstar_nef8" }
blake3 = "1.5"
flate2 = "1.0"
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-yfd-packer"
path = "src/main.rs"
