[package]
name = "northstar-ydd-packer"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "North Star NEF8/ListFile drawable dictionary importer for OBJ, glTF, GLB and FBX sources"
license = "MIT"

[dependencies]
northstar-cli = { path = "../../shared/northstar_cli" }
northstar-nef8 = { path = "../../shared/northstar_nef8" }
base64 = "0.22"
blake3 = "1.5"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-ydd-packer"
path = "src/main.rs"
