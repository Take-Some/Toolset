[package]
name = "northstar-yscd-packer"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "North Star Y Sound Cue Dictionary NEF8 packer, unpacker and inspector"
license = "MIT"

[dependencies]
newengine-asset-format-nef8 = { path = "../../../NewEngine/neocore2/crates/newengine-asset-format-nef8" }
northstar-cli = { path = "../../shared/northstar_cli" }
northstar-nef8 = { path = "../../shared/northstar_nef8" }
blake3 = "1.5"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "northstar-yscd-packer"
path = "src/main.rs"
