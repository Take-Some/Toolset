[package]
name = "northstar-neui-packer"
version = "0.2.2"
edition = "2021"
build = "build.rs"
description = "Pack .neui import descriptors into runtime NEF8/XMLcentral UI dictionaries"
license = "MIT"

[dependencies]
northstar-cli = { path = "../../shared/northstar_cli" }
northstar-nef8 = { path = "../../shared/northstar_nef8" }
blake3 = "1.5"
flate2 = "1.0"
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[lib]
name = "northstar_neui_packer"
path = "src/lib.rs"

[[bin]]
name = "northstar-neui-packer"
path = "src/main.rs"
